name: Auto Commit untuk Penghijauan

on:
  schedule:
    # Berjalan setiap jam (pada menit ke-0)
    - cron: '0 * * * *'
  workflow_dispatch:
    # Memungkinkan eksekusi manual melalui tombol "Run workflow" di tab Actions

permissions:
  contents: write # Diperlukan agar GitHub Actions diizinkan melakukan push

jobs:
  auto_commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Tambahkan log waktu
        run: |
          echo "Auto commit pada $(date)" >> commit-log.txt

      - name: Commit dan Push Perubahan
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add commit-log.txt
          git commit -m "Auto commit: $(date)"
          
          # Melakukan push ke branch utama (main/master)
          git push origin HEAD
